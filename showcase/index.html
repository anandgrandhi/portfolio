<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anand Grandhi — A collection of problems</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:'Google Sans',Arial,sans-serif;color:#202124;background:#087bea;transition:background .45s ease}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid currentColor;outline-offset:5px}header{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;font-size:14px;font-weight:600}header button,footer button,.side button{background:none;border:none;padding:8px 0}a{text-decoration:none}a:hover,button:hover{text-decoration:underline}main{min-height:calc(100svh - 150px);display:grid;grid-template-columns:1fr minmax(260px,410px) 1fr;align-items:center;gap:40px;padding:28px 6vw 42px}.side{display:grid;gap:8px;justify-items:center;text-align:center;font-size:20px;font-weight:600}.side button{border-bottom:1px solid currentColor}.side small{font-size:12px;font-weight:400;opacity:.7}.stack{position:relative;isolation:isolate;margin:8px 0}.stack:before,.stack:after{content:"";position:absolute;inset:0;border-radius:32px;background:#e9e9e6;z-index:-1;transform:rotate(7deg);box-shadow:0 3px 4px #0002}.stack:after{transform:rotate(-6deg);background:#f3f2ef}.paper{position:relative;background:#f5f4f0;border-radius:30px;min-height:510px;padding:25px;display:flex;flex-direction:column;box-shadow:0 8px 25px #0002;overflow:hidden;animation:enter .32s ease-out}.pill{align-self:flex-start;background:var(--accent,#c7ddff);border-radius:40px;font-size:12px;padding:7px 12px;font-weight:600}.paper h1{font-size:clamp(27px,3vw,37px);line-height:1.08;letter-spacing:-1.35px;margin:22px 0 18px;font-weight:600}.art{position:relative;min-height:210px;flex:1;display:grid;place-items:center;overflow:hidden;border:1px solid #20212433;border-radius:7px;background:#dce6e9;isolation:isolate}.shape{position:absolute;border:1.5px solid #20212466;z-index:-1}.s1{height:67%;width:65%;background:#fbbc04;border-radius:50%;left:-20%;top:-25%}.s2{height:75%;width:55%;background:#34a853;border-radius:46% 54% 65% 35%;right:-20%;top:-14%;transform:rotate(25deg)}.s3{height:73%;width:57%;background:#ea4335;border-radius:50% 50% 0 0;right:-12%;bottom:-25%;transform:rotate(-22deg)}.s4{height:56%;width:60%;background:#4285f4;left:-19%;bottom:-15%;transform:rotate(21deg)}.window{background:#fffdf7;border:1.5px solid #252525;border-radius:9px;width:83%;transform:rotate(-5deg);box-shadow:6px 7px 0 #202124;overflow:hidden}.bar{padding:9px;border-bottom:1px solid #333;display:flex;gap:5px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#ea4335}.dot:nth-child(2){background:#fbbc04}.dot:nth-child(3){background:#34a853}.bar span:last-child{font-size:9px;margin-left:auto;color:#5f6368}.inside{padding:17px 13px;display:grid;gap:8px}.big{font-size:clamp(27px,4vw,48px);font-weight:700;letter-spacing:-2px;line-height:1.05}.sub{font-size:12px;color:#5f6368}.mini{width:100%;height:65px}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:11px;font-weight:500}.card-foot button{background:none;border:0;padding:5px;font-size:12px}footer{display:flex;justify-content:space-between;align-items:center;padding:16px 36px;font-size:13px}.switch{display:flex;gap:3px;border-radius:30px;background:#202124;padding:4px;color:white}.switch button{border-radius:50%;padding:7px 10px;font-size:17px;line-height:1;background:none;border:0;color:white}.switch button[aria-pressed=true]{background:white;color:#202124}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;padding:25px 6vw 50px}.tile{border:0;border-radius:22px;text-align:left;padding:22px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;box-shadow:0 4px 0 #20212425;transition:transform .2s}.tile:hover{transform:translateY(-5px);text-decoration:none}.tile b{font-size:25px;line-height:1.12;letter-spacing:-.6px}.tile strong{font-size:24px}.tile small{font-size:12px}.tile span{display:flex;justify-content:space-between;gap:8px}dialog{border:0;border-radius:28px;width:min(850px,94vw);max-height:90svh;padding:0;background:#f9f8f4;color:#202124;box-shadow:0 15px 60px #0003}dialog::backdrop{background:#20212499;backdrop-filter:blur(7px)}.detail{padding:36px 48px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.close{border:1px solid #20212433;border-radius:50%;width:40px;height:40px;background:white;font-size:23px}.detail h2{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-1.6px;margin:25px 0}.detail p{font-size:17px;line-height:1.65;color:#42454a}.detail h3{font-size:20px;margin-bottom:6px}.detail .outcome{background:#e4edff;border-radius:16px;padding:24px;margin:25px 0}.detail .outcome b{font-size:36px;letter-spacing:-1px}.detail .outcome p{margin-bottom:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.context{background:#fff0c6;padding:18px;border-radius:12px;font-size:14px;line-height:1.5}.detail-nav{display:flex;justify-content:space-between;border-top:1px solid #ccc;padding-top:20px;margin-top:25px}.detail-nav button{border:0;background:none;font-weight:600}.hide,[hidden]{display:none!important}@keyframes enter{from{opacity:.2;transform:translateY(18px) rotate(4deg) scale(.96)}to{opacity:1;transform:none}}@media(max-width:700px){header,footer{padding:16px 20px}main{grid-template-columns:1fr 1fr;gap:25px;padding:15px 25px 28px;min-height:0}.stack{grid-column:1/-1;grid-row:1;width:min(100%,360px);justify-self:center}.paper{min-height:460px;padding:21px}.side{font-size:17px}.side.prev{grid-column:1}.side.next{grid-column:2}.detail{padding:24px}.detail-grid{grid-template-columns:1fr}.grid{padding:20px}.art{min-height:190px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><header><button id="about">About</button><span>Anand Grandhi · Selected work</span><a href="../preview/">Original portfolio ↗</a></header><main id="deck"><div class="side prev"><button id="previous">← Previous card</button><small id="count"></small></div><div class="stack" id="stack"></div><div class="side next"><button id="read">Show me! ↗</button><button id="next">Next card →</button></div></main><section id="grid" class="grid" hidden aria-label="All project cards"></section><footer><span>Product · Operations · AI</span><div class="switch" aria-label="View mode"><button id="deckMode" aria-label="Card view" aria-pressed="true">▣</button><button id="gridMode" aria-label="Grid view" aria-pressed="false">▦</button></div><a href="https://anandgrandhi.com">Contact ↗</a></footer><dialog id="dialog"><div class="detail" id="detail"></div></dialog><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=s=>document.querySelector(s);const palette=['#087bea','#fbbc04','#34a853','#ea4335','#9fc0ff','#f5b5d2'];const tints=['#c8dfff','#fff0b2','#c9efd5','#ffd3cd','#e4eaff','#fce2ee'];let data,items=[],i=0,mode='deck';const dialog=$('#dialog');
function color(n){return palette[n%palette.length]}function tint(n){return tints[n%tints.length]}function label(p){return p.company.split(' · ')[0]}
function graphic(p,n){const metric=p.metric||['Explore','Connect','Build'][n%3];return '<div class="art" aria-label="Illustrative project graphic"><i class="shape s1"></i><i class="shape s2"></i><i class="shape s3"></i><i class="shape s4"></i><div class="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>'+esc(label(p))+'</span></div><div class="inside"><div class="big">'+esc(metric)+'</div><div class="sub">'+esc(p.unit||'Selected work')+'</div><svg class="mini" viewBox="0 0 240 65" aria-hidden="true"><path d="M0 60H240M0 32H240" stroke="#ddd"/>'+ (n%3===0?'<path d="M4 48L38 39L74 47L110 25L147 33L184 13L236 5" fill="none" stroke="#4285f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>':n%3===1?'<rect x="14" y="36" width="36" height="24" rx="4" fill="#4285f4"/><rect x="65" y="24" width="36" height="36" rx="4" fill="#34a853"/><rect x="116" y="13" width="36" height="47" rx="4" fill="#fbbc04"/><rect x="167" y="4" width="36" height="56" rx="4" fill="#ea4335"/>':'<g stroke="#202124" fill="#fff"><path d="M35 33H120L204 12M120 33L204 54" fill="none"/><circle cx="35" cy="33" r="13" fill="#4285f4"/><circle cx="120" cy="33" r="15" fill="#fbbc04"/><circle cx="204" cy="12" r="10" fill="#34a853"/><circle cx="204" cy="54" r="10" fill="#ea4335"/></g>')+'</svg></div></div></div>'}
function render(){const p=items[i];if(!p)return;document.body.style.background=color(i);$('#stack').innerHTML='<article class="paper" style="--accent:'+tint(i)+'"><span class="pill">'+esc(p.company)+'</span><h1>'+esc(p.title)+'</h1>'+graphic(p,i)+'<div class="card-foot"><span>Illustrative project graphic</span><button id="cardOpen">Explore case ↗</button></div></article>';$('#cardOpen').onclick=()=>openCase(i);$('#count').textContent=String(i+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');}
function move(n){i=(i+n+items.length)%items.length;render()}
function view(v){mode=v;$('#deck').hidden=v!=='deck';$('#grid').hidden=v!=='grid';$('#deckMode').setAttribute('aria-pressed',v==='deck');$('#gridMode').setAttribute('aria-pressed',v==='grid');if(v==='grid'){document.body.style.background='#f0efec';$('#grid').innerHTML=items.map((p,n)=>'<button class="tile" data-index="'+n+'" style="background:'+tint(n)+'"><small>'+esc(p.company)+'</small><b>'+esc(p.title)+'</b><span><strong>'+esc(p.metric||'Explore')+'</strong>↗</span></button>').join('');$('#grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{i=Number(b.dataset.index);openCase(i)})}else render()}
function openCase(n){i=n;const p=items[n];$('#detail').innerHTML='<div class="detail-head"><span class="pill" style="background:'+tint(n)+'">'+esc(p.company)+'</span><button class="close" aria-label="Close">×</button></div><h2>'+esc(p.title)+'</h2><p>'+esc(p.status)+'</p>'+ (p.context?'<div class="context">'+esc(p.context)+'</div>':'')+'<h3>The business problem</h3><p>'+esc(p.problem)+'</p><div class="detail-grid">'+[['Discovery',p.discovery],['Product decisions',p.decision],['What we built',p.approach],['Reliability',p.assurance]].filter(x=>x[1]).map(x=>'<div><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('')+'</div><div class="outcome"><small>What changed</small><br><b>'+esc(p.metric||'Project outcome')+'</b><p>'+esc(p.outcome)+'</p></div><div class="detail-nav"><button id="casePrev">← Previous case</button><button id="caseNext">Next case →</button></div>';$('#detail .close').onclick=()=>dialog.close();$('#casePrev').onclick=()=>openCase((i-1+items.length)%items.length);$('#caseNext').onclick=()=>openCase((i+1)%items.length);if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
$('#about').onclick=()=>{if(!data)return;$('#detail').innerHTML='<div class="detail-head"><span>About</span><button class="close" aria-label="Close">×</button></div><h2>Complex problems. Practical solutions.</h2>'+data.intro.map(s=>'<p>'+s+'</p>').join('')+'<h3>Experience</h3>'+data.jobs.map(j=>'<p><b>'+esc(j[0])+'</b> · '+esc(j[1])+' · '+esc(j[2])+'</p>').join('')+'<p><a href="../preview/">Read the original portfolio ↗</a></p>';$('#detail .close').onclick=()=>dialog.close();dialog.showModal()};$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#read').onclick=()=>openCase(i);$('#deckMode').onclick=()=>view('deck');$('#gridMode').onclick=()=>view('grid');dialog.addEventListener('close',()=>{if(mode==='deck')render()});document.addEventListener('keydown',e=>{if(dialog.open||mode!=='deck'||!items.length)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let start=0;$('#stack').addEventListener('touchstart',e=>start=e.changedTouches[0].screenX,{passive:true});$('#stack').addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-start;if(Math.abs(delta)>55)move(delta<0?1:-1)},{passive:true});fetch('../content.json').then(r=>{if(!r.ok)throw Error('Could not load portfolio');return r.json()}).then(d=>{data=d;items=[1,0,5,2,4,9,3,6,8,7,10].map(n=>d.projects[n]).filter(Boolean);render()}).catch(e=>$('#stack').textContent=e.message);
</script></body></html>
