<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anand Grandhi — Selected work</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

th:36px;height:36px;border-radius:50%;border:1px solid #c9c9c7;font-size:24px}.plus:after{content:'+'}details[open] .plus:after{content:'−'}.case{padding:12px 0 32px}.case-top{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center;background:#f1f1ef;border-radius:22px;padding:30px}.case-top h3,.case h3{font-size:23px;line-height:1.2;font-weight:500;margin:8px 0 12px}.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px 40px;padding:28px 0}.case-grid p,.case-top p{color:#414548}.case-grid>div{border-top:1px solid #ddd;padding-top:12px}.context{background:#fff4cf;border-radius:16px;padding:20px;margin-top:20px}.outcome{background:#e4f0fe;border-radius:20px;padding:24px}.outcome p{margin:0}.graphic{width:100%;height:auto;max-height:290px}.caption{font-size:11px;color:#5f6368;margin-top:8px}.status{display:inline-block;color:#5f6368;font-size:12px;margin-bottom:14px}.experience{padding:60px 0 0}.job{display:grid;grid-template-columns:1fr 2fr auto;gap:20px;border-bottom:1px solid #ccc;padding:16px 0}.job b{font-weight:500}.job small{color:#5f6368}.notes{display:flex;flex-wrap:wrap;gap:15px}.notes a{border:1px solid #aaa;border-radius:100px;padding:9px 15px}footer{padding:30px 5vw;color:#fff;display:flex;justify-content:space-between;gap:15px;font-size:14px}@media(max-width:700px){header{padding:16px 5vw;gap:15px}header nav{gap:12px}main{width:96%;border-radius:30px 30px 0 0;padding:24px 16px}.hero{grid-template-columns:1fr;gap:20px;padding:10px 10px 35px}.hero-art{max-width:260px}.work{padding:20px 16px;border-radius:22px}summary{grid-template-columns:1fr 32px;gap:10px;padding:18px 0}.metric{grid-row:2;grid-column:1}.plus{grid-row:1;grid-column:2;width:32px;height:32px}.case-top,.case-grid{grid-template-columns:1fr;gap:15px}.case-top{padding:20px}.job{grid-template-columns:1fr 1fr;gap:5px}.job small{grid-column:2}footer{flex-wrap:wrap}}
</style></head><body><header><a href="#about">About</a><span>Anand Grandhi</span><nav><a href="#work">Work</a><a href="#experience">Experience</a></nav></header><main><section class="hero" id="about"><div><span class="tag">Product · Operations · AI</span><h1>Complex problems.<br>Practical solutions.</h1><div class="intro" id="intro"></div></div><svg class="hero-art" viewBox="0 0 440 350" role="img" aria-label="Abstract illustration of connected product and workflow systems"><g stroke="#202124" stroke-width="1.5"><circle cx="100" cy="85" r="66" fill="#ea4335"/><rect x="257" y="30" width="110" height="110" rx="12" fill="#fbbc04" transform="rotate(18 312 85)"/><path d="M290 185Q420 180 406 290Q365 350 283 305Z" fill="#34a853"/><rect x="26" y="224" width="114" height="90" rx="7" fill="#4285f4" transform="rotate(-14 83 269)"/><rect x="92" y="76" width="248" height="188" rx="13" fill="#202124" transform="translate(7 7)"/><rect x="92" y="76" width="248" height="188" rx="13" fill="#fff"/><path d="M92 107H340"/><circle cx="108" cy="92" r="5" fill="#ea4335"/><circle cx="124" cy="92" r="5" fill="#fbbc04"/><circle cx="140" cy="92" r="5" fill="#34a853"/><path d="M150 183H216L277 148M216 183L277 222" fill="none"/><rect x="125" y="160" width="50" height="46" rx="9" fill="#d2e3fc"/><circle cx="216" cy="183" r="24" fill="#fbbc04"/><rect x="255" y="125" width="46" height="46" rx="9" fill="#ceead6"/><rect x="255" y="199" width="46" height="46" rx="9" fill="#fce8e6"/></g></svg></section><section class="work" id="work"><span class="section-label">Selected work</span><h2>Problems worth solving.</h2><div id="projects">Loading projects…</div></section><section class="experience" id="experience"><span class="section-label">Experience</span><h2>Where I’ve worked.</h2><div id="jobs"></div></section><section class="experience"><span class="section-label">Reading & notes</span><h2>Ideas I’m exploring.</h2><div class="notes" id="notes"></div></section></main><footer><span>© Anand Grandhi</span><a href="../preview/">Original portfolio ↗</a><a href="https://anandgrandhi.com">Contact ↗</a></footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=s=>document.querySelector(s);const colors=['#1a73e8','#188038','#b06000','#c5221f'];function graphic(p,i){const c=colors[i%4];return '<svg class="graphic" viewBox="0 0 420 250" role="img" aria-label="Illustrative project graphic"><g stroke="#202124" stroke-width="1.3"><circle cx="72" cy="66" r="49" fill="#ea4335"/><rect x="292" y="22" width="92" height="90" rx="14" fill="#fbbc04" transform="rotate(18 338 67)"/><circle cx="341" cy="189" r="49" fill="#34a853"/><rect x="35" y="160" width="85" height="68" rx="8" fill="#4285f4" transform="rotate(-13 77 194)"/><rect x="83" y="48" width="255" height="155" rx="10" fill="#202124" transform="translate(5 5)"/><rect x="83" y="48" width="255" height="155" rx="10" fill="white"/><path d="M83 74H338"/><circle cx="97" cy="61" r="4" fill="#ea4335"/><circle cx="109" cy="61" r="4" fill="#fbbc04"/><circle cx="121" cy="61" r="4" fill="#34a853"/></g><text x="210" y="126" text-anchor="middle" font-family="Google Sans,Arial" font-size="30" fill="'+c+'" font-weight="600">'+esc(p.metric||'Product design')+'</text><text x="210" y="149" text-anchor="middle" font-size="11" fill="#5f6368">'+esc(p.unit||'Selected work')+'</text><g fill="'+c+'" opacity=".65"><rect x="123" y="175" width="174" height="5" rx="2.5"/><rect x="123" y="185" width="108" height="5" rx="2.5"/></g></svg>'}fetch('../content.json').then(r=>{if(!r.ok)throw Error('Unable to load portfolio');return r.json()}).then(d=>{$('#intro').innerHTML=d.intro.map(x=>'<p>'+x+'</p>').join('');$('#projects').innerHTML=[1,0,5,2,4,9,3,6,8,7,10].map(n=>d.projects[n]).filter(Boolean).map((p,i)=>'<details><summary><div><span class="company">'+esc(p.company)+'</span><span class="title">'+esc(p.title)+'</span></div><span class="metric" style="color:'+colors[i%4]+'">'+esc(p.metric)+'<small>'+esc(p.unit)+'</small></span><span class="plus" aria-hidden="true"></span></summary><div class="case"><span class="status">'+esc(p.status)+'</span><div class="case-top"><div><span class="section-label">The problem</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.problem)+'</p></div><div>'+graphic(p,i)+'<div class="caption">Illustrative project graphic · not original product evidence</div></div></div>'+(p.context?'<div class="context">'+esc(p.context)+'</div>':'')+'<div class="case-grid">'+[['What I discovered',p.discovery],['Product decisions',p.decision],['What we built',p.approach],['Reliability',p.assurance]].filter(x=>x[1]).map(x=>'<div><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('')+'</div><div class="outcome"><span class="section-label">The outcome</span><h3>'+esc(p.metric||'What changed')+'</h3><p>'+esc(p.outcome)+'</p></div></div></details>').join('');$('#jobs').innerHTML=d.jobs.map(j=>'<div class="job"><b>'+esc(j[0])+'</b><span>'+esc(j[1])+'</span><small>'+esc(j[2])+'</small></div>').join('');$('#notes').innerHTML=d.notes.filter(n=>/^https:\/\//.test(n[1])).map(n=>'<a href="'+esc(n[1])+'">'+esc(n[0])+' ↗</a>').join('')}).catch(e=>$('#projects').textContent=e.message);
</script></body></html>
