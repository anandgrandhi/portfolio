function render(){const intro={k:'Product · Operations · Applied AI',title:'Complex problems.<br><span>Practical solutions.</span>',desc:data.intro.map(x=>'<p>'+x+'</p>').join(''),type:'intro',accent:palette[0],intro:true};const ids=[1,0,5,2];const types=['growth','workflow','learning','ai'];slides=[intro,...ids.map((id,i)=>{const p=data.projects[id];return {k:p.company,title:esc(p.title),desc:esc(p.problem),type:types[i],accent:dark[i],metric:p.metric,unit:p.unit,id}})];careerStart=slides.length;slides.push(...eras.map((e,i)=>({k:e[0],title:esc(e[1]),desc:esc(e[2]),type:e[3],accent:dark[i%4],career:true})));navStart=slides.length;slides.push({library:true,k:'All projects',title:'Explore every case.'});world.querySelectorAll('.slide').forEach(el=>el.remove());slides.forEach((p,i)=>{const el=document.createElement('section');el.className='slide'+(p.intro?' intro':'')+(p.library?' library':'');el.style.setProperty('--accent',p.accent||palette[0]);el.setAttribute('aria-label',p.k);if(p.library){el.innerHTML='<div class="lib-inner"><div class="kicker">Project index</div><h2>All eleven problems.</h2><p class="desc">Open a case for discovery, product decisions, execution and outcomes.</p><div class="lib-list">'+data.projects.map((q,j)=>'<button data-case="'+j+'"><span><small>'+esc(q.company)+'</small><span class="t">'+esc(q.title)+'</span></span><span class="m">'+esc(q.metric||'Explore')+' ↗</span></button>').join('')+'</div></div>'}else{el.innerHTML='<div class="copy"><div class="kicker"><i class="point"></i>'+esc(p.k)+'</div><'+(p.intro?'h1':'h2')+'>'+p.title+'</'+(p.intro?'h1':'h2')+'>'+(p.metric?'<div class="metric">'+esc(p.metric)+'</div><div class="unit">'+esc(p.unit)+'</div>':'')+'<div class="desc">'+p.desc+'</div>'+(p.intro?'<button class="pill" data-jump="1">Begin the journey →</button><div class="hint">Scroll horizontally or use your mouse wheel.</div>':p.id!=null?'<button class="pill" data-case="'+p.id+'">Explore case study ↗</button>':'')+'</div><div class="vi function geometry(){const nodes=[...world.querySelectorAll('.slide')],h=world.clientHeight,w=world.scrollWidth;if(!nodes.length)return;ribbon.setAttribute('viewBox','0 0 '+w+' '+h);ribbon.setAttribute('width',w);ribbon.setAttribute('height',h);centres=nodes.map(el=>el.offsetLeft+el.offsetWidth/2);let p='M 0 '+h*.67;nodes.forEach((el,i)=>{const x=el.offsetLeft,ww=el.offsetWidth,y=h*(i%2===0?.72:.28);p+=' C '+(x+ww*.12)+' '+h*.67+' '+(x+ww*.12)+' '+y+' '+(x+ww*.30)+' '+y+' S '+(x+ww*.57)+' '+h*.12+' '+(x+ww*.71)+' '+h*.37+' S '+(x+ww*.86)+' '+h*.89+' '+(x+ww)+' '+h*.67});trail.setAttribute('d',p);ink.setAttribute('d',p);len=ink.getTotalLength();ink.style.strokeDasharray=len;let dust='';for(let j=0;j<nodes.length*15;j++){const x=(j*137.51)%w,y=(j*67.13)%h;dust+='<circle class="particle" cx="'+x+'" cy="'+y+'" r="'+(j%3===0?2.3:1.3)+'" fill="'+palette[j%4]+'" opacity=".25"/>'}$('#dust').innerHTML=dust;nodes.forEach(el=>el.querySelectorAll('.draw').forEach(s=>{const l=s.getTotalLength();s.dataset.len=l;s.style.strokeDasharray=l}));target=clamp(viewport.scrollLeft,0,Math.max(0,w-viewport.clientWidth))}
function paint(){const x=viewport.scrollLeft,vw=viewport.clientWidth,center=x+vw/2,nodes=[...world.querySelectorAll('.slide')];let closest=0,min=Infinity;nodes.forEach((el,i)=>{const d=(centres[i]-center)/vw;if(Math.abs(d)<min){closest=i;min=Math.abs(d)}if(Math.abs(d)>1.8)return;const p=clamp(1-Math.abs(d)*.83),copy=el.querySelector('.copy'),visual=el.querySelector('.visual'),scene=el.querySelector('.scene');if(copy){copy.style.opacity=reduce.matches?1:.55+p*.45;copy.style.transform=reduce.matches?'none':'translate3d('+(-d*18)+'px,0,0)'}if(visual){visual.style.opacity=reduce.matches?1:.4+p*.6;visual.style.transform=reduce.matches?'none':'translate3d('+(-d*38)+'px,0,0) rotateY('+(-d*7)+'deg) scale('+(0.91+p*.09)+')'}if(scene)scene.style.transform=reduce.matches?'none':'rotate('+(-d*5)+'deg)';el.querySelectorAll('.float').forEach((q,j)=>{q.style.transform=reduce.matches?'none':'translate('+d*(j%2?13:-13)+'px,'+d*(j%3-1)*18+'px)'});el.querySelectorAll('.draw').forEach((q,j)=>{q.style.strokeDashoffset=Number(q.dataset.len||0)*(1-(reduce.matches?1:clamp(p*1.4-j*.035)))})});if(len){const pos=clamp(center/world.scrollWidth),pt=ink.getPointAtLength(pos*len);ink.style.strokeDashoffset=len*(1-pos);[dot,halo].forEach(q=>{q.setAttribute('cx',pt.x);q.setAttribute('cy',pt.y)});halo.setAttribute('r',12+Math.min(8,Math.abs(target-x)*.07))}if(closest!==active){active=closest;$('#counter').textContent=String(active+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');$('#prev').disabled=active===0;$('#next').disabled=active===slides.length-1;$('#timeline').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('active',i===active);b.classList.toggle('past',i<active);if(i===active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}}
function animate(){raf=0;const delta=target-viewport.scrollLeft;if(reduce.matches||Math.abs(delta)<.7){viewport.scrollLeft=target;paint();return}viewport.scrollLeft+=delta*.14;paint();raf=requestAnimationFrame(animate)}function seek(x){target=clamp(x,0,world.scrollWidth-viewport.clientWidth);if(!raf)raf=requestAnimationFrame(animate)}function go(i){i=clamp(i,0,slides.length-1);seek(centres[i]-viewport.clientWidth/2)}viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey||e.target.closest('.lib-inner')&&Math.abs(e.deltaY)>Math.abs(e.deltaX))return;const dy=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY,scale=e.deltaMode===1?16:e.deltaMode===2?viewport.clientWidth:1;e.preventDefault();seek(target+dy*scale*1.1)},{passive:false});viewport.addEventListener('scroll',()=>{if(!raf)target=viewport.scrollLeft;paint()},{passive:true});viewport.addEventListener('touchstart',()=>{if(raf)cancelAnimationFrame(raf);raf=0;target=viewport.scrollLeft},{passive:true});viewport.addEventListener('pointerdown',()=>{if(raf)cancelAnimationFrame(raf);raf=0;target=viewport.scrollLeft});document.addEventListener('keydown',e=>{if($('#dialog').open||e.target.closest('button,a, input'))return;if(['ArrowRight','ArrowLeft','PageDown','PageUp','Home','End'].includes(e.key)){e.preventDefault();go(e.key==='Home'?0:e.key==='End'?slides.length-1:active+(['ArrowRight','PageDown'].includes(e.key)?1:-1))}});$('#home').onclick=e=>{e.preventDefault();go(0)};$('#work').onclick=()=>go(1);$('#career').onclick=()=>go(careerStart);$('#all').onclick=()=>go(navStart);$('#prev').onclick=()=>go(active-1);$('#next').onclick=()=>go(active+1);addEventListener('resize',()=>{geometry();paint()});
function openCase(id){const p=data.projects[id];$('#case').innerHTML='<div class="case-head"><span>'+esc(p.company)+'</span><button class="close" aria-label="Close case">×</button></div><h2>'+esc(p.title)+'</h2><p>'+esc(p.status)+'</p>'+[['The business problem',p.problem],['Discovery',p.discovery],['Product decisions',p.decision],['What we built',p.approach],['Reliability',p.assurance]].filter(x=>x[1]).map(x=>'<h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p>').join('')+'<div class="outcome"><h3>What changed</h3><p>'+esc(p.outcome)+'</p></div>'+(p.context?'<div class="context">'+esc(p.context)+'</div>':'');$('#case .close').onclick=()=>$('#dialog').close();$('#dialog').showModal();$('#dialog').scrollTop=0}
fetch('../content.json').then(r=>{if(!r.ok)throw Error('Unable to load portfolio');return r.json()}).then(d=>{data=d;render()}).catch(e=>$('#loading .desc').textContent=e.message);
