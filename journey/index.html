*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:400 16px/1.6 'Google Sans',Arial,sans-serif;color:#202124;background:#fafaf9}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{position:fixed;inset:0 0 auto;z-index:20;background:#fafaf9e8;backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;padding:17px 5vw;border-bottom:1px solid #ddd}header nav{display:flex;gap:22px;font-size:14px}header a:hover{color:#1967d2}.hero{min-height:85svh;display:grid;align-content:center;padding:110px 8vw 70px;max-width:1300px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5f6368}.hero h1{font-size:clamp(48px,8vw,106px);font-weight:400;line-height:.99;letter-spacing:-.06em;margin:26px 0 32px}.hero h1 span{color:#1a73e8}.intro{max-width:760px;font-size:19px;color:#44474d}.intro p{margin:0 0 13px}.start{margin-top:24px;display:inline-flex;width:max-content;gap:15px;align-items:center;border:1px solid #c7cacf;border-radius:30px;padding:10px 20px}.journey{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1500px;margin:auto;padding:0 6vw;gap:6vw}.stage{position:sticky;top:90px;height:calc(100svh - 125px);display:grid;align-content:center;align-self:start}.canvas{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#e8f0fe;display:grid;place-items:center;transition:background .65s ease}.canvas svg{width:94%;height:94%}.artlayer{opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform:scale(.94) translateY(12px)}.artlayer.on{opacity:1;transform:none}.node{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}.node:nth-child(2){animation-delay:-1s}.node:nth-child(3){animation-delay:-2s}@keyframes pulse{50%{transform:scale(1.08)}}.stage-label{display:flex;justify-content:space-between;font-size:13px;color:#5f6368;margin-top:14px}.progress{height:2px;background:#d9dce1;margin-top:12px}.progress i{display:block;background:#1a73e8;height:100%;width:0;transition:width .5s}.chapter{min-height:76svh;display:flex;flex-direction:column;justify-content:center;padding:80px 0;scroll-margin-top:90px;border-top:1px solid #d9dce1}.chapter:first-child{border:0}.chapter .number{font-size:12px;color:#74777d;letter-spacing:.12em}.company{font-size:14px;color:#1967d2;margin:14px 0}.chapter h2{font-size:clamp(30px,3.8vw,58px);font-weight:400;line-height:1.1;letter-spacing:-.045em;margin:0 0 22px}.metric{font-size:clamp(32px,4.5vw,64px);letter-spacing:-.05em;line-height:1.05;font-weight:500;margin:12px 0 4px}.unit{font-size:13px;color:#5f6368}.chapter>p{font-size:17px;color:#47494e;max-width:600px}details{border-top:1px solid #dadce0;border-bottom:1px solid #dadce0;margin-top:18px}summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:15px 0;font-weight:500}summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:23px;font-weight:400}details[open] summary:after{content:'−'}.case{padding:3px 0 20px}.case h3{font-weight:500;font-size:17px;margin:18px 0 4px}.case p{margin:0;color:#4a4c51}.context{background:#e8f0fe;border-radius:12px;padding:15px;margin-top:18px;font-size:14px}.index{position:fixed;right:1.7vw;top:50%;transform:translateY(-50%);display:grid;gap:11px;z-index:10}.index a{display:block;width:8px;height:8px;border:1px solid #74777d;border-radius:50%;transition:background .3s,transform .3s}.index a.active{background:#1967d2;border-color:#1967d2;transform:scale(1.5)}.bottom{max-width:1100px;margin:auto;padding:90px 6vw}.bottom h2{font-size:45px;font-weight:400;letter-spacing:-.04em}.job{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;border-top:1px solid #ddd;padding:18px 0}footer{border-top:1px solid #ddd;padding:24px 6vw;display:flex;justify-content:space-between;gap:15px;font-size:14px}.mobileart{display:none}.fallback{padding:30px}.chapter:focus-within{opacity:1}@media(max-width:760px){header{padding:13px 5vw}header nav{gap:12px}.hero{min-height:75svh;padding:95px 6vw 40px}.intro{font-size:16px}.journey{display:block;padding:0 6vw}.stage,.index{display:none}.chapter{min-height:0;padding:38px 0;scroll-margin-top:60px}.mobileart{display:grid;place-items:center;border-radius:18px;aspect-ratio:1.5;overflow:hidden;margin:15px 0}.mobileart svg{width:80%;height:100%}.mobileart .artlayer{opacity:1;transform:none}.job{grid-template-columns:1fr 1fr}.job small{grid-column:2}footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><header><a href="#top"><b>Anand Grandhi</b></a><nav><a href="#work">Selected work</a><a href="#experience">Experience</a><a href="../preview/">Original ↗</a></nav></header><section class="hero" id="top"><span class="eyebrow">Product · Operations · Applied AI</span><h1>Complex problems.<br><span>Practical solutions.</span></h1><div class="intro" id="intro"></div><a href="#work" class="start">Explore selected work <span>↓</span></a></section><main class="journey" id="work"><aside class="stage" aria-label="Illustrative project visual"><div class="canvas" id="canvas"></div><div class="stage-label"><span id="label">Selected work</span><span id="counter"></span></div><div class="progress"><i id="progress"></i></div></aside><div id="chapters">Loading projects…</div></main><nav class="index" id="index" aria-label="Project navigation"></nav><section class="bottom" id="experience"><span class="eyebrow">Experience</span><h2>Building across disciplines.</h2><div id="jobs"></div></section><footer><span>© Anand Grandhi</span><a href="../showcase/">Accordion experiment ↗</a><a href="https://anandgrandhi.com">Contact ↗</a></footer><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const palettes=[['#e8f0fe','#4285f4'],['#e6f4ea','#34a853'],['#fef7e0','#f9ab00'],['#f3e8fd','#9334e6'],['#fce8e6','#ea4335']];let items=[],current=-1;
function art(p,i){const c=palettes[i%5][1];let visual='';if([0,4,6].includes(i)){visual='<g stroke="#d2d6dc" stroke-width="1"><path d="M80 270H320M80 220H320M80 170H320"/></g><path d="M90 258L130 230L170 242L210 190L250 205L310 150" fill="none" stroke="'+c+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="150" r="7" fill="'+c+'"/>'}else if([1,3,5,8].includes(i)){visual='<g stroke="'+c+'" stroke-width="2" fill="none"><path d="M100 216H180L260 165M180 216L260 267M260 165L320 216M260 267L320 216"/></g><g fill="'+c+'"><circle class="node" cx="100" cy="216" r="18"/><circle class="node" cx="180" cy="216" r="22"/><circle class="node" cx="260" cy="165" r="15"/><circle class="node" cx="260" cy="267" r="15"/><circle class="node" cx="320" cy="216" r="19"/></g>'}else{visual='<g fill="'+c+'"><rect x="100" y="222" width="42" height="48" rx="7" opacity=".4"/><rect x="155" y="196" width="42" height="74" rx="7" opacity=".6"/><rect x="210" y="171" width="42" height="99" rx="7" opacity=".8"/><rect x="265" y="142" width="42" height="128" rx="7"/></g>'}return '<svg viewBox="0 0 400 400" role="img" aria-label="Conceptual illustration, not original analytics"><g class="artlayer on"><circle cx="200" cy="200" r="174" fill="none" stroke="'+c+'" opacity=".2"/><circle cx="200" cy="200" r="145" fill="none" stroke="'+c+'" opacity=".15"/><rect x="55" y="90" width="290" height="215" rx="18" fill="#fff" stroke="#d0d5dc"/><path d="M55 121H345" stroke="#d0d5dc"/><circle cx="73" cy="106" r="4" fill="#ea4335"/><circle cx="86" cy="106" r="4" fill="#fbbc04"/><circle cx="99" cy="106" r="4" fill="#34a853"/>'+visual+'<rect x="105" y="50" width="190" height="83" rx="15" fill="#fff" stroke="#d0d5dc"/><text x="200" y="86" text-anchor="middle" font-size="26" font-family="Google Sans,Arial" fill="'+c+'" font-weight="500">'+esc(p.metric||'Product systems')+'</text><text x="200" y="108" text-anchor="middle" font-size="10" fill="#5f6368">'+esc(p.unit||'Selected work')+'</text><text x="200" y="347" text-anchor="middle" font-size="10" fill="#5f6368">Illustrative project graphic</text></g></svg>'}
function setActive(i){if(i===current||!items[i])return;current=i;const p=items[i];$('#canvas').style.background=palettes[i%5][0];$('#canvas').innerHTML=art(p,i);const layer=$('#canvas .artlayer');layer.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add('on')));$('#label').textContent=p.company;$('#counter').textContent=String(i+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');$('#progress').style.width=((i+1)/items.length*100)+'%';document.querySelectorAll('.index a').forEach((a,n)=>a.classList.toggle('active',n===i))}
fetch('../content.json').then(r=>{if(!r.ok)throw Error('Unable to load projects');return r.json()}).then(d=>{items=[1,0,5,2,4,9,3,6,8,7,10].map(i=>d.projects[i]).filter(Boolean);$('#intro').innerHTML=d.intro.map(x=>'<p>'+x+'</p>').join('');$('#chapters').innerHTML=items.map((p,i)=>'<article class="chapter" id="project-'+(i+1)+'"><span class="number">PROJECT '+String(i+1).padStart(2,'0')+'</span><div class="company">'+esc(p.company)+'</div><h2>'+esc(p.title)+'</h2>'+(p.metric?'<div class="metric" style="color:'+palettes[i%5][1]+'">'+esc(p.metric)+'</div><div class="unit">'+esc(p.unit)+'</div>':'')+'<div class="mobileart" style="background:'+palettes[i%5][0]+'">'+art(p,i)+'</div><p>'+esc(p.problem)+'</p><details><summary>Explore case study</summary><div class="case"><small>'+esc(p.status)+'</small>'+[['Discovery',p.discovery],['Product decisions',p.decision],['What we built',p.approach],['Reliability',p.assurance],['What changed',p.outcome]].filter(x=>x[1]).map(x=>'<h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p>').join('')+(p.context?'<div class="context">'+esc(p.context)+'</div>':'')+'</div></details></article>').join('');$('#index').innerHTML=items.map((p,i)=>'<a href="#project-'+(i+1)+'" title="'+esc(p.title)+'" aria-label="'+esc(p.title)+'"></a>').join('');$('#jobs').innerHTML=d.jobs.map(j=>'<div class="job"><b>'+esc(j[0])+'</b><span>'+esc(j[1])+'</span><small>'+esc(j[2])+'</small></div>').join('');setActive(0);let queued=false;function update(){queued=false;const chapters=[...document.querySelectorAll('.chapter')];let n=0;for(let k=0;k<chapters.length;k++){if(chapters[k].getBoundingClientRect().top<innerHeight*.55)n=k;}setActive(n)}addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});addEventListener('resize',update);update()}).catch(e=>$('#chapters').textContent=e.message);
</script></body></html>
