*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:400 16px/1.6 'InterVariable',Arial,sans-serif;color:#242923;background:#fbf9f6}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{position:fixed;inset:0 0 auto;z-index:20;background:#fbf9f6e8;backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;padding:17px 5vw;border-bottom:1px solid #ddd}header nav{display:flex;gap:22px;font-size:14px}header a:hover{color:#386650}.hero{min-height:85svh;display:grid;align-content:center;padding:110px 8vw 70px;max-width:1300px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#58615a}.hero h1{font-size:clamp(48px,8vw,106px);font-weight:400;line-height:.99;letter-spacing:-.06em;margin:26px 0 32px}.hero h1 span{color:#386650}.intro{max-width:760px;font-size:19px;color:#44474d}.intro p{margin:0 0 13px}.start{margin-top:24px;display:inline-flex;width:max-content;gap:15px;align-items:center;border:1px solid #c7cacf;border-radius:30px;padding:10px 20px}.journey{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1500px;margin:auto;padding:0 6vw;gap:6vw}.stage{position:sticky;top:90px;height:calc(100svh - 125px);display:grid;align-content:center;align-self:start}.canvas{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#dceee3;display:grid;place-items:center;transition:background .65s ease}.canvas svg{width:94%;height:94%}.artlayer{opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform:scale(.94) translateY(12px)}.artlayer.on{opacity:1;transform:none}.node{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}.node:nth-child(2){animation-delay:-1s}.node:nth-child(3){animation-delay:-2s}@keyframes pulse{50%{transform:scale(1.08)}}.stage-label{display:flex;justify-content:space-between;font-size:13px;color:#58615a;margin-top:14px}.progress{height:2px;backgr const availableFonts=["San Francisco","Inter Display","Suisse Intl","PP Mori","PP Neue Montreal"];const fontChoice=document.getElementById('fontChoice');const stacks={'San Francisco':'-apple-system,BlinkMacSystemFont,system-ui,sans-serif','Inter Display':'"InterVariable","Inter",sans-serif','Suisse Intl':'"Suisse Intl","Suisse Int’l","Suisse International","InterVariable",sans-serif','PP Mori':'"PP Mori","Mori","InterVariable",sans-serif','PP Neue Montreal':'"PP Neue Montreal","Neue Montreal","InterVariable",sans-serif'};function applyTypeface(n){if(!availableFonts.includes(n))n='Inter Display';document.body.style.setProperty('--chosen-font',stacks[n]);document.body.style.fontVariationSettings=n==='San Francisco'?'normal':'"opsz" 32';fontChoice.value=n;document.getElementById('fontNote').textContent=['Suisse Intl','PP Mori','PP Neue Montreal'].includes(n)?'Local font only · Inter fallback':'';try{localStorage.setItem('journey-typeface',n)}catch(e){}}fontChoice.onchange=()=>applyTypeface(fontChoice.value);document.getElementById('hideFonts').onclick=()=>{document.getElementById('fontPicker').hidden=true;document.getElementById('showFonts').hidden=false};document.getElementById('showFonts').onclick=()=>{document.getElementById('fontPicker').hidden=false;document.getElementById('showFonts').hidden=true};let savedFont='Inter Display';try{savedFont=localStorage.getItem('journey-typeface')||savedFont}catch(e){}applyTypeface(savedFont);

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const palettes=[['#dceee3','#386650'],['#e9e0f1','#715783'],['#f4e6cd','#805d2b'],['#dce8ec','#416571'],['#f4ded8','#905448']];let items=[],current=-1;
function art(p,i){const c=palettes[i%5][1];let visual='';if([0,4,6].includes(i)){visual='<g stroke="#d2d6dc" stroke-width="1"><path d="M80 270H320M80 220H320M80 170H320"/></g><path d="M90 258L130 230L170 242L210 190L250 205L310 150" fill="none" stroke="'+c+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="150" r="7" fill="'+c+'"/>'}else if([1,3,5,8].includes(i)){visual='<g stroke="'+c+'" stroke-width="2" fill="none"><path d="M100 216H180L260 165M180 216L260 267M260 165L320 216M260 267L320 216"/></g><g fill="'+c+'"><circle class="node" cx="100" cy="216" r="18"/><circle class="node" cx="180" cy="216" r="22"/><circle class="node" cx="260" cy="165" r="15"/><circle class="node" cx="260" cy="267" r="15"/><circle class="node" cx="320" cy="216" r="19"/></g>'}else{visual='<g fill="'+c+'"><rect x="100" y="222" width="42" height="48" rx="7" opacity=".4"/><rect x="155" y="196" width="42" height="74" rx="7" opacity=".6"/><rect x="210" y="171" width="42" height="99" rx="7" opacity=".8"/><rect x="265" y="142" width="42" height="128" rx="7"/></g>'}return '<svg viewBox="0 0 400 400" role="img" aria-label="Conceptual illustration, not original analytics"><g class="artlayer on"><circle cx="200" cy="200" r="174" fill="none" stroke="'+c+'" opacity=".2"/><circle cx="200" cy="200" r="145" fill="none" stroke="'+c+'" opacity=".15"/><rect x="55" y="90" width="290" height="215" rx="18" fill="#fff" stroke="#d0d5dc"/><path d="M55 121H345" stroke="#d0d5dc"/><circle cx="73" cy="106" r="4" fill="#ad6458"/><circle cx="86" cy="106" r="4" fill="#a5864f"/><circle cx="99" cy="106" r="4" fill="#628775"/>'+visual+'<rect x="105" y="50" width="190" height="83" rx="15" fill="#fff" stroke="#d0d5dc"/><text x="200" y="86" text-anchor="middle" font-size="26" font-family="inherit" fill="'+c+'" font-weight="400">'+esc(p.metric||'Product systems')+'</text><text x="200" y="108" text-anchor="middle" font-size="10" fill="#58615a">'+esc(p.unit||'Selected work')+'</text><text x="200" y="347" text-anchor="middle" font-size="10" fill="#58615a">Illustrative project graphic</text></g></svg>'}
function setActive(i){if(i===current||!items[i])return;current=i;const p=items[i];$('#canvas').style.background=palettes[i%5][0];$('#canvas').innerHTML=art(p,i);const layer=$('#canvas .artlayer');layer.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add('on')));$('#label').textContent=p.company;$('#counter').textContent=String(i+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');$('#progress').style.width=((i+1)/items.length*100)+'%';document.querySelectorAll('.index a').forEach((a,n)=>a.classList.toggle('active',n===i))}
fetch('../content.json').then(r=>{if(!r.ok)throw Error('Unable to load projects');return r.json()}).then(d=>{items=[1,0,5,2,4,9,3,6,8,7,10].map(i=>d.projects[i]).filter(Boolean);$('#intro').innerHTML=d.intro.map(x=>'<p>'+x+'</p>').join('');$('#chapters').innerHTML=items.map((p,i)=>'<article class="chapter" id="project-'+(i+1)+'"><span class="number">PROJECT '+String(i+1).padStart(2,'0')+'</span><div class="company">'+esc(p.company)+'</div><h2>'+esc(p.title)+'</h2>'+(p.metric?'<div class="metric" style="color:'+palettes[i%5][1]+'">'+esc(p.metric)+'</div><div class="unit">'+esc(p.unit)+'</div>':'')+'<div class="mobileart" style="background:'+palettes[i%5][0]+'">'+art(p,i)+'</div><p>'+esc(p.problem)+'</p><details><summary>Explore case study</summary><div class="case"><small>'+esc(p.status)+'</small>'+[['Discovery',p.discovery],['Product decisions',p.decision],['What we built',p.approach],['Reliability',p.assurance],['What changed',p.outcome]].filter(x=>x[1]).map(x=>'<h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p>').join('')+(p.context?'<div class="context">'+esc(p.context)+'</div>':'')+'</div></details></article>').join('');$('#index').innerHTML=items.map((p,i)=>'<a href="#project-'+(i+1)+'" title="'+esc(p.title)+'" aria-label="'+esc(p.title)+'"></a>').join('');$('#jobs').innerHTML=d.jobs.map(j=>'<div class="job"><b>'+esc(j[0])+'</b><span>'+esc(j[1])+'</span><small>'+esc(j[2])+'</small></div>').join('');setActive(0);let queued=false;function update(){queued=false;const chapters=[...document.querySelectorAll('.chapter')];let n=0;for(let k=0;k<chapters.length;k++){if(chapters[k].getBoundingClientRect().top<innerHeight*.55)n=k;}setActive(n)}addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});addEventListener('resize',update);update()}).catch(e=>$('#chapters').textContent=e.message);
</script></body></html>
